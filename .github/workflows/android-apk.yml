name: Android APK

# Manual compile check; publish configured, verified APKs separately.
# This artifact uses Expo's prototype signing key, unsuitable for Play Store.

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: mobile-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Run unit tests
        run: npm test
      # android/ is gitignored (Continuous Native Generation) -- generate it
      # from app.json and its config plugins, same as EAS would.
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build release APK
        working-directory: mobile-app/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Rename APK
        run: |
          NAME="ar-helmet-nav-${GITHUB_REF_NAME//\//-}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: mobile-app/${{ env.APK_NAME }}
