name: CI

"on":
  push:
    branches: ["**"]
  pull_request:

jobs:
  shared-tests:
    name: shared contracts (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test

  vision-ai-tests:
    name: vision-ai tests (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vision-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Deliberately not `pip install -r requirements.txt`: that pulls in
      # torch/ultralytics/opencv (multi-GB) that none of these tests need.
      # They stub out ultralytics/cv2 and only exercise pure logic, so only
      # the lightweight deps that logic actually touches (yaml parsing,
      # train/val/test splitting) are installed here.
      - name: Install lightweight test dependencies
        run: pip install pyyaml scikit-learn
      - name: Run unit tests
        run: python -m unittest discover -s . -p "test_*.py" -v

  mobile-app-tests:
    name: mobile-app tests (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: mobile-app/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Run unit tests
        run: npm test

  website-build:
    name: website build (Vite + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build

  firmware-build:
    name: firmware build (PlatformIO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Build firmware
        working-directory: firmware
        run: pio run
